### Train SmartRes-Lite: router and LoRA adapter together.

model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
dataset_dir: data
template: qwen2_vl
trust_remote_code: true
infer_backend: huggingface

dataset: mllm_rec_egoint_10to50
output_dir: saves/smartres-lite

cutoff_len: 131072
image_max_pixels: 12845056
preprocessing_num_workers: 4
report_to: none
ddp_timeout: 180000000

### SmartRes
use_smartres: true
tau: 0.5
router_layer: 30
lr_budget: 0.10
hr_budget: 0.50
encode_snap: window

### Training
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_alpha: 16
lora_dropout: 0.05
additional_target: visual.router
per_device_train_batch_size: 1
# Effective batch is 1 x 8 x world size; the released checkpoint used 2 GPUs, so 16. Raising
# the per-device batch needs ~80GB: the vision attention builds a dense [1, L, L] mask.
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
selector_learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
save_steps: 500
logging_steps: 10

### Routing objective
lambda_route: 0.01
lambda_hinge: 0.05
ddp_find_unused_parameters: true
use_reentrant_gc: false
# Required, not optional: gradient_checkpointing: true makes HF Trainer re-enable
# checkpointing with kwargs=None, which silently reverts to reentrant and breaks DDP.
gradient_checkpointing_kwargs:
  use_reentrant: false
overwrite_cache: false
plot_loss: true
overwrite_output_dir: true
