### Evaluate SmartRes-Lite: r_LR = 10%, r_HR = 50%.

model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
adapter_name_or_path: checkpoints/smartres-lite
dataset_dir: data
template: qwen2_vl_bbox
trust_remote_code: true
infer_backend: huggingface

eval_dataset: egointention_context_test_10to50
output_dir: outputs/eval_lite_context

do_predict: true
predict_with_generate: true
per_device_eval_batch_size: 1
max_new_tokens: 5120
min_new_tokens: 20
do_sample: false
cutoff_len: 131072
image_max_pixels: 12845056
preprocessing_num_workers: 4
report_to: none
ddp_timeout: 180000000

### SmartRes
use_smartres: true
tau: 0.5
router_layer: 30
lr_budget: 0.10
hr_budget: 0.50
encode_snap: window
