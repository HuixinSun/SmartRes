### Train SmartRes-Lite: router and LoRA adapter together.

model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
dataset_dir: data
template: qwen2_vl
trust_remote_code: true
infer_backend: huggingface

dataset: mllm_rec_egoint_10to50
output_dir: saves/smartres-lite

cutoff_len: 131072
image_max_pixels: 12845056
preprocessing_num_workers: 4
report_to: none
ddp_timeout: 180000000

### SmartRes
use_smartres: true
tau: 0.5
router_layer: 30
lr_budget: 0.10
hr_budget: 0.50
encode_snap: window

### Training
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_alpha: 16
lora_dropout: 0.05
additional_target: visual.router
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
selector_learning_rate: 1.0e-4
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
save_steps: 500
logging_steps: 10

### Routing objective
lambda_route: 1.0
lambda_hinge: 5.0
ddp_find_unused_parameters: true
use_reentrant_gc: false
overwrite_cache: false
plot_loss: true
overwrite_output_dir: true
